name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Unit and integration tests
        run: pytest -q

  evals:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Seed and start service
        run: |
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
      - name: Run scenario evaluations
        run: python -m evals.run_evals --base-url http://localhost:8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/report.md
