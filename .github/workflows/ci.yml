name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Unit and integration tests
        run: pytest -q

  migrations:
    # Two things are checked here. First, that the migrations actually apply to
    # an empty database and reverse cleanly. Second, and more useful, that no
    # model change has been committed without a matching migration — the drift
    # that silently leaves a deployed schema stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: alembic upgrade head
      - name: Migrations reverse cleanly
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Models and migrations agree
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: |
          alembic revision --autogenerate -m "ci drift probe" >/dev/null
          probe=$(ls -t alembic/versions/*ci_drift_probe*.py | head -1)
          # Matches both op.* and batch_op.*: render_as_batch emits the latter,
          # and a pattern anchored on "op." alone silently misses every
          # column change. Verified by deliberately introducing drift.
          if grep -qE "(batch_)?op\.(create|drop|alter|add|rename)_" "$probe"; then
            echo "Models have changed without a migration. Generated diff:"
            sed -n '/def upgrade/,/def downgrade/p' "$probe"
            exit 1
          fi
          echo "No schema drift."

  evals:
    runs-on: ubuntu-latest
    needs: [test, migrations]
    strategy:
      # Both delivery channels get a full end-to-end run. The unit tests cover
      # each adapter in isolation, but only this catches a channel that is wired
      # up wrongly — a customer with no address on the active channel fails at
      # issuance, and that is invisible to a test that patches the sender.
      fail-fast: false
      matrix:
        channel: [sms, email]
    name: evals (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Seed and start service
        env:
          # Demo mode echoes the passcode so the two-factor scenarios can run.
          # Safe here: the service is ephemeral and never reachable from outside.
          OTP_DEMO_MODE: "true"
          OTP_DELIVERY_CHANNEL: ${{ matrix.channel }}
        run: |
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/readyz && break
            sleep 1
          done
          curl -sf localhost:8000/readyz || (echo "service never became ready"; cat /tmp/service.log; exit 1)

      - name: Run scenario evaluations
        run: |
          python -m evals.run_evals \
            --base-url http://localhost:8000 \
            --json evals/report.json

      - name: Service logs on failure
        if: failure()
        run: cat /tmp/service.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ matrix.channel }}
          path: |
            evals/report.md
            evals/report.json

  evals-without-demo-mode:
    # The scenarios needing a passcode must skip cleanly rather than fail when
    # the service does not echo one, because that is the correct production
    # setting. A regression here would either break real deployments or make the
    # suite silently meaningless against them.
    runs-on: ubuntu-latest
    needs: [test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Seed and start service
        run: |
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/readyz && break
            sleep 1
          done
      - name: Suite must pass with passcode scenarios skipped
        run: |
          python -m evals.run_evals --base-url http://localhost:8000
          grep -q "scenario(s) skipped" evals/report.md \
            || (echo "expected skipped scenarios without demo mode"; exit 1)
